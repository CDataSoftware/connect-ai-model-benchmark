# price_cached_input_per_mtok: Together and Groq don't currently bill separately for cached tokens;
# set equal to price_input_per_mtok to avoid under-reporting. Update if the provider adds caching.
# Prices verified 2026-08-28 at api.together.ai — verify before each run, prices change.
# Together does not bill cached tokens separately; price_cached_input_per_mtok = price_input_per_mtok.
