# Model matrix — 25 models, 12 developers.
# NOTE: `provider` below is the API DIALECT the harness speaks (anthropic/openai/google/xai/
# openai_compat), not the model's developer and not its host. Open-weight models are served by
# Together.ai but built by Meta, DeepSeek, Alibaba and others; see the README model table.
# Prices in USD per MTok. run_matrix checks Together and xAI prices against their APIs before a
# run; the rest are entered by hand. Billing is provider-aware:
#   OpenAI / Grok - reasoning tokens NESTED inside output (don't add again)
#   Google        - thoughts tokens ADDITIVE, billed at output rate
#   Anthropic     - thinking tokens billed INSIDE output_tokens; thinking_chars is logged as a
#                   proxy for reasoning effort.
#   Grok          - tiered pricing: under 200K prompt tokens $2/$6, above $4/$12 per MTok.
#                   All benchmark runs have been well under 200K; lower tier used here.
#
# --- effort
# `effort` is the reasoning level, a single value or a list; the harness runs each model once per
# listed level. `run_matrix.py --effort X` instead runs every selected model at X and stops if any
# of them can't take it. Levels: default (send nothing; provider default), low, medium, high,
# xhigh, max. Gemini tops out at high. Haiku 4.5 uses a fixed thinking_budget and open-weight
# endpoints expose no setting, so both run at default only.
# Levels are NOT equivalent across providers: "low" names each provider's own low setting.

# --- tiers
# `tier` is the model's CAPABILITY CLASS, not a price band. It records where the developer
# positions the model in its own lineup, capped by whether that developer fields a
# frontier-class model in this set:
#   economy   the developer's efficiency line   (Haiku, GPT Luna, Flash-Lite, Mistral
#             Small, Qwen 9B, Muse Glimmer, DeepSeek Flash)
#   mid       the mainstream workhorse line     (Gemini Flash, Mistral Large, DeepSeek Pro,
#             Qwen Max, GLM-5.3, Grok 4.3)
#   frontier  the developer's top reasoning model, and only where that developer fields one
#             here (Sonnet 5, Opus 5.5, Fable 5/5.1, GPT-6 Sol/Astra, Grok 4.7, Kimi K3, Inkling)
# The cap is why Mistral Large and Qwen 3.7 Max sit at mid: each is its developer's flagship,
# but neither developer fields a frontier-class entry in this set.
#
# Deliberately NOT derived at runtime:
#   - price does not reproduce these labels (Haiku 4.5 costs $1.00/MTok at economy; Mistral
#     Large 3 costs $0.50 at mid). Deriving tier from price would also make the whitepaper's
#     "same answer across every tier" claim circular.
#   - model names do not either: "Flash" is Google's workhorse but DeepSeek's small variant.
#
# These values are FROZEN to match Table 1 of the published MCP cost whitepaper (Sep 2026).
# Changing one changes a published figure; add new models by the definition above instead.

# --- models
models:
  - { id: claude-haiku-4-5,      provider: anthropic, tier: economy, label: Haiku 4.5,        price_input_per_mtok: 1.00, price_cached_input_per_mtok: 0.10,  price_output_per_mtok: 5.00,  thinking_budget: 2048, effort: default }
