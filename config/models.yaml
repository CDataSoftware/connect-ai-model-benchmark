  - { id: claude-opus-5,         provider: anthropic, tier: frontier, label: Opus 5,           price_input_per_mtok: 5.00,  price_cached_input_per_mtok: 0.50, price_output_per_mtok: 25.00, thinking_budget: 2048 }
  - { id: gpt-5.6,               provider: openai, tier: frontier,    label: GPT-5.6,          price_input_per_mtok: 4.00,  price_cached_input_per_mtok: 0.40, price_output_per_mtok: 20.00, reasoning_effort: low }
