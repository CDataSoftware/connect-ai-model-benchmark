  # Fable 5 is kept for this edition only, as the published R2 ceiling; Fable 5.1 replaces it.
  - { id: claude-fable-5,        provider: anthropic, tier: frontier, label: Fable 5,          price_input_per_mtok: 10.00, price_cached_input_per_mtok: 1.00, price_output_per_mtok: 50.00, effort: low }
