  - { id: gpt-5.5,               provider: openai, tier: frontier,    label: GPT-5.5,          price_input_per_mtok: 5.00, price_cached_input_per_mtok: 0.50,  price_output_per_mtok: 30.00, reasoning_effort: low }
  - { id: gpt-5.4-mini,          provider: openai, tier: economy,    label: GPT-5.4 mini,     price_input_per_mtok: 0.75, price_cached_input_per_mtok: 0.075, price_output_per_mtok: 4.50,  reasoning_effort: low }
  - { id: gemini-3.5-flash,      provider: google, tier: mid,    label: Gemini 3.5 Flash, price_input_per_mtok: 1.50, price_cached_input_per_mtok: 0.15,  price_output_per_mtok: 9.00,  thinking_level: low }
