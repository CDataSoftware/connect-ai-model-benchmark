# TASKS. Each task is a prompt + golden + scoring mode, run across its own conditions.
#   scoring: answer        -> scorer.score()      (R1: health + eligibility)
#            answer_r2     -> scorer.score_r2()   (R2: health + usage-trend composition)
#            action        -> scorer.score_action() graded on REVIEW_QUEUE's end state, not prose
# turn_cap is per-condition: curated toolkits converge in ~3 turns, but raw federation needs far
# more headroom (baseline previously strangled at 12 - most runs never left schema discovery).
tasks:
  - id: r1
    prompt_file: config/prompt.txt
    golden_file: config/golden_result.csv
    scoring: answer
    # R1's completed 117 runs are tagged {model}__{condition}__run{n} with no task segment.
    # legacy_tag keeps that filename shape so those runs stay valid and are not re-run.
    legacy_tag: true
    conditions:
      - { name: baseline,  mcp_url_env: MCP_BASELINE_URL,  runs: 3,  turn_cap: 40 }
      - { name: optimized, mcp_url_env: MCP_OPTIMIZED_URL, runs: 10, turn_cap: 12 }

  - id: r2
    prompt_file: config/prompt_r2.txt
    golden_file: config/golden_result_r2.csv   # 44 rows, generated by make_goldens.py
    scoring: answer_r2
    conditions:
      # R2-baseline reuses the baseline toolkit as-is: it already exposes all 6 raw tables
      # including DIM_ACCOUNT + TELEMETRY_EVENTS, which is everything this task needs.
      - { name: baseline,  mcp_url_env: MCP_BASELINE_URL, runs: 5, turn_cap: 40 }
      - { name: optimized, mcp_url_env: MCP_R2_OPTIMIZED_URL,  runs: 8, turn_cap: 12 }

  - id: a1
    prompt_file: config/prompt_a1.txt
    golden_file: config/golden_action_a1.csv   # the 21 eligible-CRITICAL accounts
    scoring: action
    # every run of this task resets REVIEW_QUEUE before it starts and reads the table back
    # afterwards over the harness's own credentials (core/verifier.py) -- never via the toolkit
    # under test, which would be circular.
    reset_before_run: true
    conditions:
      - { name: baseline, mcp_url_env: MCP_A1_BASELINE_URL, runs: 5, turn_cap: 40 }
      - { name: unguarded,          mcp_url_env: MCP_A1_UNGUARDED_URL,    runs: 8, turn_cap: 12 }
      # ENABLED 2026-07-27. Was blocked by the CData push-down bug; worked around with a
      # single-connection ACCOUNT_HEALTH_SNAPSHOT table (Scheduled Query
      # off account_health_score), so the guarded tool's INSERT...SELECT is now single-catalog.
      # A second, distinct bug turned up in that rewrite -- the engine resolves INSERT...SELECT
      # columns BY NAME, not position, and silently reuses the first column's value when a
      # destination name (REASON) has no exact source match (ELIGIBILITY_REASON) instead of
      # erroring. Fixed with `AS REASON`; full 5-point checklist re-verified against the live MCP
      # tool afterward (eligible/dedupe/ineligible/wrong-reason/second-account all correct).
      - { name: guarded, mcp_url_env: MCP_A1_GUARDED_URL, runs: 8, turn_cap: 12 }

# temperature: applied where the provider allows it. Reasoning-on OpenAI and thinking-on
# Anthropic force the provider default (~1.0); per-run temperature_applied records what happened.
temperature: 0
turn_cap: 12   # fallback if a condition omits turn_cap
